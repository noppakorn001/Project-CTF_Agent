[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agent"
version = "0.1.0"
description = "Local-first, token-aware orchestration console for authorized CTF challenges"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CTF Agent contributors" }]
dependencies = []

[project.scripts]
ctf-agent = "ctf_agent.__main__:main"

[tool.setuptools]
packages = ["ctf_agent"]

[tool.setuptools.package-data]
ctf_agent = ["static/*"]
